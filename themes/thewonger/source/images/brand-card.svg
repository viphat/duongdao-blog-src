  <rect width="1200" height="675" rx="28" fill="#ffffff"/>
  <image href="kiwi-flaticon.png" x="480" y="126" width="240" height="240" preserveAspectRatio="xMidYMid meet"/>
  <text x="600" y="420" text-anchor="middle" fill="#171717" font-family="Be Vietnam Pro, Inter, Arial, sans-serif" font-size="50" font-weight="800">Dương &amp; Đào Family</text>
  <text x="600" y="462" text-anchor="middle" fill="#666666" font-family="Be Vietnam Pro, Inter, Arial, sans-serif" font-size="22" font-weight="500">Nhật ký gia đình, học hỏi và những chuyến đi</text>
  <path d="M132 512h936" stroke="#e5e5e5" stroke-width="2"/>
  <g fill="#16835f" font-family="Be Vietnam Pro, Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="474" y="558">Sống</text>
